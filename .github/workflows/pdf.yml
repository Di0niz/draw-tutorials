name: pdf

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Собрать PDF всех уроков
        run: |
          set -e
          for dir in lessons/*/; do
            slug=$(basename "$dir")
            if [ "$slug" = "00-smoke" ] || [ ! -f "$dir/slides.md" ]; then
              continue
            fi
            echo "::group::$slug"
            pnpm pdf "$slug"
            echo "::endgroup::"
          done
          ls -la lessons/*/dist/*.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: lesson-pdfs
          path: lessons/*/dist/*.pdf
          if-no-files-found: error

      - name: Приложить PDF к релизу
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" lessons/*/dist/*.pdf --generate-notes
