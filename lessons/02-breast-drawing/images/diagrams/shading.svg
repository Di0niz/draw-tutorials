    <ellipse cx="248" cy="196" rx="40" ry="36" transform="rotate(14 248 196)"/>
  </g>

  <g stroke="#9aa0a6" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M168 174 C180 186 184 202 180 218"/>
    <path d="M158 180 C172 192 176 208 172 224"/>
    <path d="M148 186 C162 198 166 212 162 226"/>
    <path d="M138 194 C150 204 154 216 151 228"/>
    <path d="M128 204 C138 212 142 220 140 228"/>
    <path d="M264 174 C276 186 280 202 276 218"/>
    <path d="M254 180 C268 192 272 208 268 224"/>
    <path d="M244 186 C258 198 262 212 258 226"/>
    <path d="M234 194 C246 204 250 216 247 228"/>
    <path d="M224 204 C234 212 238 220 236 228"/>
  </g>

  <g stroke="#9aa0a6" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M132 232 C148 244 176 246 190 238"/>
    <path d="M228 232 C244 244 272 246 286 238"/>
  </g>

  <g stroke="#e0dacd" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M124 224 C140 236 168 238 182 230"/>
    <path d="M220 224 C236 236 264 238 278 230"/>
  </g>

  <circle cx="134" cy="208" r="5" fill="#6b7280"/>
  <circle cx="266" cy="208" r="5" fill="#6b7280"/>

  <line class="lead" x1="292" y1="196" x2="336" y2="176"/>
  <text class="lbl" x="342" y="172">одна большая тень</text>
  <text class="sub" x="342" y="190">теневая сторона массы</text>
  <text class="sub" x="342" y="208">и тень под ней — одним пятном</text>

  <line class="lead" x1="290" y1="236" x2="336" y2="250"/>
  <text class="lbl" x="342" y="246">рефлекс снизу</text>
  <text class="sub" x="342" y="264">светлее тени, темнее света</text>

  <line class="lead" x1="272" y1="208" x2="336" y2="310"/>
  <text class="acc" x="342" y="306">сосок не темнее тени</text>

  <text class="sub" x="26" y="384">Прищурься: на рисунке должно остаться два пятна, свет и тень.</text>
  <text class="sub" x="26" y="402">Если видно больше трёх, ты начал детализировать раньше времени.</text>
</svg>
