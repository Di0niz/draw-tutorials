<svg width="620" height="440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="Inter, sans-serif">
  <style>
    .lbl { font-size: 13px; fill: #1f2328 }
    .sub { font-size: 12px; fill: #6b7280 }
    .acc { font-size: 13px; font-weight: 700; fill: #b4530a }
    .lead { stroke: #c9c2b4; stroke-width: 1.3 }
  </style>
  <defs>
    <marker id="sh-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4530a"/>
    </marker>
  </defs>

  <path d="M62 52 L112 102" stroke="#b4530a" stroke-width="2.4" marker-end="url(#sh-arrow)"/>
  <text class="acc" x="26" y="42">свет</text>

  <g fill="none" stroke="#1f2328" stroke-width="2.6" stroke-linejoin="round">
    <path d="M110 76 C96 156 100 248 122 304 C158 330 242 330 278 304 C300 248 304 156 290 76 C258 50 142 50 110 76 Z"/>
    <path d="M128 72 C162 56 238 56 272 72"/>
