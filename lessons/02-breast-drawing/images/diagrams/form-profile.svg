<svg width="520" height="470" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="Inter, sans-serif">
  <style>
    .lbl { font-size: 13px; fill: #1f2328 }
    .sub { font-size: 12px; fill: #6b7280 }
    .acc { font-size: 13px; font-weight: 700; fill: #b4530a }
    .lead { stroke: #c9c2b4; stroke-width: 1.3 }
  </style>

  <g fill="none" stroke="#1f2328" stroke-width="2.6" stroke-linejoin="round">
    <path d="M166 70 C176 58 194 58 202 70"/>
    <path d="M202 70 C224 106 230 186 220 262 C214 304 206 328 198 348"/>
    <path d="M166 70 C144 106 136 186 144 262 C148 304 156 330 164 348"/>
  </g>

  <line x1="214" y1="140" x2="217" y2="288" stroke="#c9c2b4" stroke-width="1.6" stroke-dasharray="5 5"/>

  <path d="M216 144 C262 166 294 212 286 250 C276 288 238 296 216 286"
        fill="none" stroke="#1f2328" stroke-width="2.8"/>

  <path d="M222 152 C254 170 274 194 282 216" fill="none" stroke="#b4530a" stroke-width="2.6"/>
  <path d="M284 262 C272 284 246 296 218 292" fill="none" stroke="#b4530a" stroke-width="2.6"/>

  <circle cx="288" cy="240" r="5" fill="#b4530a"/>

  <g stroke="#c9c2b4" stroke-width="1.4" stroke-dasharray="4 5">
    <line x1="216" y1="144" x2="330" y2="144"/>
    <line x1="216" y1="288" x2="330" y2="288"/>
    <line x1="288" y1="240" x2="330" y2="240"/>
  </g>

  <text class="acc" x="300" y="122">верхний скат</text>
  <text class="sub" x="300" y="140">прямой или чуть вогнутый</text>

  <text class="acc" x="300" y="318">нижний скат</text>
  <text class="sub" x="300" y="336">полная дуга, самая полная точка ближе к низу</text>

  <text class="lbl" x="336" y="236">сосок на нижней трети</text>
  <text class="sub" x="336" y="254">и смещён наружу, не в центре</text>

  <line class="lead" x1="212" y1="290" x2="150" y2="316"/>
  <text class="lbl" x="20" y="322">место контакта с клеткой</text>
  <text class="sub" x="20" y="340">складка под грудью — это тень,</text>
  <text class="sub" x="20" y="358">а не проведённая линия</text>

  <text class="sub" x="20" y="410">Разная высота посадки и разный объём меняют пропорцию</text>
  <text class="sub" x="20" y="428">скатов, но порядок остаётся: верх спокойнее, низ полнее.</text>
</svg>
