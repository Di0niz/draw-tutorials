<svg width="660" height="470" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="Inter, sans-serif">
  <style>
    .ttl { font-size: 15px; font-weight: 700; fill: #1f2328 }
    .lbl { font-size: 13px; fill: #1f2328 }
    .sub { font-size: 12px; fill: #6b7280 }
    .acc { font-size: 13px; fill: #b4530a }
    .lead { stroke: #c9c2b4; stroke-width: 1.3 }
  </style>

  <text class="ttl" x="20" y="26">Спереди</text>

  <g fill="none" stroke="#1f2328" stroke-width="2.6" stroke-linejoin="round">
    <path d="M100 96 C86 176 90 268 112 324 C148 350 232 350 268 324 C290 268 294 176 280 96 C248 70 132 70 100 96 Z"/>
    <path d="M118 92 C152 76 228 76 262 92"/>
    <path d="M136 324 L190 352 L244 324"/>
  </g>

  <line x1="190" y1="84" x2="190" y2="352" stroke="#c9c2b4" stroke-width="1.6" stroke-dasharray="5 5"/>

  <g fill="none" stroke="#b4530a" stroke-width="2">
    <path d="M110 150 C148 166 232 166 270 150"/>
    <path d="M106 232 C148 252 232 252 274 232"/>
  </g>

  <line class="lead" x1="278" y1="196" x2="318" y2="186"/>
  <text class="acc" x="324" y="182">поверхность гнутая</text>
  <text class="sub" x="324" y="200">рёбра идут дугой</text>
  <text class="sub" x="324" y="218">от грудины вбок и вниз</text>

  <line class="lead" x1="190" y1="352" x2="318" y2="330"/>
  <text class="lbl" x="324" y="326">нижний край рёбер</text>
  <text class="sub" x="324" y="344">ниже него груди нет</text>

  <line x1="360" y1="40" x2="360" y2="430" stroke="#e5e7eb" stroke-width="2"/>

  <text class="ttl" x="400" y="26">Сбоку</text>

  <g fill="none" stroke="#1f2328" stroke-width="2.6" stroke-linejoin="round">
    <path d="M466 80 C476 68 494 68 502 80"/>
    <path d="M502 80 C524 116 530 196 520 272 C514 314 506 336 498 356"/>
    <path d="M466 80 C444 116 436 196 444 272 C448 314 456 338 464 356"/>
  </g>

  <g fill="none" stroke="#b4530a" stroke-width="2.4">
    <path d="M512 130 L516 290"/>
  </g>
  <text class="acc" x="536" y="196">передняя</text>
  <text class="acc" x="536" y="214">плоскость</text>
  <text class="sub" x="536" y="232">почти вертикальна,</text>
  <text class="sub" x="536" y="250">чуть завалена назад</text>

  <text class="sub" x="400" y="400">Клетка — бочка, сужённая кверху. Всё, что</text>
  <text class="sub" x="400" y="418">лежит спереди, садится на эту поверхность.</text>

  <text class="sub" x="20" y="400">Строится первой. Пока нет клетки,</text>
  <text class="sub" x="20" y="418">грудь не на чем разместить.</text>
</svg>
