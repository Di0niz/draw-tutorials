<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Inter, sans-serif">
  <style>
    .cap { font-size: 14px; font-weight: 700; fill: #1f2328 }
    .sub { font-size: 12px; fill: #6b7280 }
    .acc { font-size: 12px; fill: #b4530a }
  </style>
  <defs>
    <path id="pc-chest" d="M40 40 C30 100 33 160 48 196 C74 216 126 216 152 196 C167 160 170 100 160 40 C140 22 60 22 40 40 Z"/>
  </defs>

  <g transform="translate(20,40)">
    <g fill="none" stroke="#1f2328" stroke-width="2.4" stroke-linejoin="round">
      <use href="#pc-chest"/>
      <ellipse cx="74" cy="122" rx="27" ry="25" transform="rotate(-12 74 122)"/>
      <ellipse cx="126" cy="122" rx="27" ry="25" transform="rotate(12 126 122)"/>
      <path d="M34 46 C20 96 20 150 26 190"/>
      <path d="M166 46 C180 96 180 150 174 190"/>
    </g>
    <path d="M52 140 C66 152 84 152 98 142" fill="none" stroke="#b4530a" stroke-width="2.4"/>
    <text class="cap" x="100" y="250" text-anchor="middle">Рука опущена</text>
    <text class="acc" x="100" y="270" text-anchor="middle">складка снизу выражена</text>
    <text class="sub" x="100" y="288" text-anchor="middle">масса лежит на клетке</text>
  </g>

  <g transform="translate(250,40)">
    <g fill="none" stroke="#1f2328" stroke-width="2.4" stroke-linejoin="round">
      <use href="#pc-chest"/>
      <ellipse cx="70" cy="106" rx="24" ry="27" transform="rotate(-28 70 106)"/>
      <ellipse cx="130" cy="106" rx="24" ry="27" transform="rotate(28 130 106)"/>
      <path d="M34 46 C22 30 24 8 34 -8"/>
      <path d="M166 46 C178 30 176 8 166 -8"/>
    </g>
    <g stroke="#b4530a" stroke-width="2" fill="none">
      <path d="M58 132 L48 108"/>
      <path d="M142 132 L152 108"/>
    </g>
    <text class="cap" x="100" y="250" text-anchor="middle">Руки подняты</text>
    <text class="acc" x="100" y="270" text-anchor="middle">складка почти исчезла</text>
    <text class="sub" x="100" y="288" text-anchor="middle">масса ушла вверх и наружу</text>
  </g>

  <g transform="translate(480,40)">
    <g fill="none" stroke="#1f2328" stroke-width="2.4" stroke-linejoin="round">
      <path d="M46 56 C30 112 38 166 58 200 C86 220 138 214 160 192 C172 152 170 96 156 48 C134 30 66 34 46 56 Z"/>
      <path d="M78 150 C64 176 72 200 94 206 C116 210 132 194 128 172 C124 154 106 144 92 146"/>
      <path d="M128 158 C142 180 138 200 120 206"/>
    </g>
    <path d="M70 148 C84 140 100 140 112 146" fill="none" stroke="#b4530a" stroke-width="2.4"/>
    <text class="cap" x="100" y="250" text-anchor="middle">Наклон вперёд</text>
    <text class="acc" x="100" y="270" text-anchor="middle">форма вытянута вниз</text>
    <text class="sub" x="100" y="288" text-anchor="middle">край клетки становится видим</text>
  </g>

  <text class="sub" x="24" y="352">Форма не постоянная. Меняется поза — меняется и то, что ты рисуешь:</text>
  <text class="sub" x="24" y="370">направление осей, длина нижней дуги, наличие складки.</text>
</svg>
