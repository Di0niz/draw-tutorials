<svg width="620" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="Inter, sans-serif">
  <style>
    .lbl { font-size: 13px; fill: #1f2328 }
    .sub { font-size: 12px; fill: #6b7280 }
    .acc { font-size: 13px; font-weight: 700; fill: #b4530a }
    .lead { stroke: #c9c2b4; stroke-width: 1.3 }
  </style>
  <defs>
    <marker id="fp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4530a"/>
    </marker>
  </defs>

  <g fill="none" stroke="#1f2328" stroke-width="2.6" stroke-linejoin="round">
    <path d="M100 76 C86 156 90 248 112 304 C148 330 232 330 268 304 C290 248 294 156 280 76 C248 50 132 50 100 76 Z"/>
    <path d="M118 72 C152 56 228 56 262 72"/>
    <path d="M136 304 L190 332 L244 304"/>
  </g>

  <line x1="190" y1="64" x2="190" y2="332" stroke="#c9c2b4" stroke-width="1.6" stroke-dasharray="5 5"/>

  <g fill="none" stroke="#b4530a" stroke-width="2.4" stroke-dasharray="7 6">
    <ellipse cx="140" cy="196" rx="42" ry="48" transform="rotate(-12 140 196)"/>
    <ellipse cx="240" cy="196" rx="42" ry="48" transform="rotate(12 240 196)"/>
  </g>

  <g stroke="#1f2328" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="88" y1="148" x2="296" y2="148"/>
    <line x1="88" y1="248" x2="296" y2="248"/>
    <line x1="96" y1="76" x2="96" y2="312"/>
    <line x1="284" y1="76" x2="284" y2="312"/>
  </g>

  <g stroke="#b4530a" stroke-width="2" fill="none">
    <path d="M184 172 L150 204" marker-end="url(#fp-arrow)"/>
    <path d="M196 172 L230 204" marker-end="url(#fp-arrow)"/>
  </g>

  <line class="lead" x1="300" y1="148" x2="330" y2="148"/>
  <text class="lbl" x="336" y="144">верх: 2-е ребро</text>

  <line class="lead" x1="300" y1="248" x2="330" y2="248"/>
  <text class="lbl" x="336" y="244">низ: 6-е ребро</text>

  <line class="lead" x1="284" y1="300" x2="330" y2="312"/>
  <text class="lbl" x="336" y="308">наружу: передняя</text>
  <text class="lbl" x="336" y="326">подмышечная линия</text>

  <line class="lead" x1="190" y1="230" x2="330" y2="212"/>
  <text class="lbl" x="336" y="196">внутрь: грудина</text>
  <text class="sub" x="336" y="214">между массами просвет</text>

  <text class="acc" x="20" y="392">След шире самой массы</text>
  <text class="sub" x="20" y="412">Сначала рисуешь, чем форма легла на клетку, и только потом</text>
  <text class="sub" x="20" y="430">саму форму. Оси расходятся от грудины наружу и вниз.</text>
</svg>
