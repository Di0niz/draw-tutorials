<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Inter, sans-serif">
  <style>
    .cap { font-size: 14px; font-weight: 700; fill: #1f2328 }
    .sub { font-size: 12px; fill: #6b7280 }
    .acc { font-size: 12px; fill: #b4530a }
  </style>
  <defs>
    <path id="tv-chest" d="M40 40 C30 100 33 160 48 196 C74 216 126 216 152 196 C167 160 170 100 160 40 C140 22 60 22 40 40 Z"/>
  </defs>

  <line x1="24" y1="152" x2="676" y2="152" stroke="#c9c2b4" stroke-width="1.4" stroke-dasharray="5 6"/>
  <text class="acc" x="24" y="144">сосок остаётся на одной высоте во всех трёх ракурсах</text>

  <g transform="translate(20,40)">
    <g fill="none" stroke="#1f2328" stroke-width="2.4" stroke-linejoin="round">
      <use href="#tv-chest"/>
      <ellipse cx="74" cy="118" rx="28" ry="25" transform="rotate(-12 74 118)"/>
      <ellipse cx="126" cy="118" rx="28" ry="25" transform="rotate(12 126 118)"/>
    </g>
    <circle cx="64" cy="127" r="4" fill="#b4530a"/>
    <circle cx="136" cy="127" r="4" fill="#b4530a"/>
    <line x1="100" y1="34" x2="100" y2="200" stroke="#c9c2b4" stroke-width="1.4" stroke-dasharray="4 5"/>
    <text class="cap" x="100" y="246" text-anchor="middle">Фас</text>
    <text class="sub" x="100" y="266" text-anchor="middle">массы равны,</text>
    <text class="sub" x="100" y="284" text-anchor="middle">просвет по центру</text>
  </g>

  <g transform="translate(250,40)">
    <g fill="none" stroke="#1f2328" stroke-width="2.4" stroke-linejoin="round">
      <use href="#tv-chest"/>
      <ellipse cx="112" cy="118" rx="30" ry="26" transform="rotate(10 112 118)"/>
      <path d="M62 100 C48 108 44 130 54 142 C62 150 74 150 82 144"/>
    </g>
    <circle cx="126" cy="128" r="4" fill="#b4530a"/>
    <circle cx="52" cy="126" r="4" fill="#b4530a"/>
    <line x1="126" y1="34" x2="126" y2="200" stroke="#c9c2b4" stroke-width="1.4" stroke-dasharray="4 5"/>
    <text class="cap" x="100" y="246" text-anchor="middle">Три четверти</text>
    <text class="sub" x="100" y="266" text-anchor="middle">дальняя масса короче</text>
    <text class="sub" x="100" y="284" text-anchor="middle">и уходит за силуэт</text>
  </g>

  <g transform="translate(480,40)">
    <g fill="none" stroke="#1f2328" stroke-width="2.4" stroke-linejoin="round">
      <path d="M78 24 C100 52 106 118 98 180 C94 200 88 212 82 224"/>
      <path d="M78 24 C56 52 50 118 58 180 C62 200 68 214 74 224"/>
      <path d="M96 96 C134 112 156 146 148 172 C140 196 112 202 96 194"/>
    </g>
    <circle cx="150" cy="150" r="4" fill="#b4530a"/>
    <text class="cap" x="100" y="246" text-anchor="middle">Профиль</text>
    <text class="sub" x="100" y="266" text-anchor="middle">видна разница скатов,</text>
    <text class="sub" x="100" y="284" text-anchor="middle">вторая масса не видна</text>
  </g>

  <text class="sub" x="24" y="356">Поворот корпуса меняет видимую ширину массы, но не её посадку на клетке:</text>
  <text class="sub" x="24" y="374">верх, низ и высота соска остаются на тех же уровнях.</text>
</svg>
