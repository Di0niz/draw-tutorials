    <text class="sub" x="82" y="316" text-anchor="middle">ложится чашей</text>
  </g>

  <text class="sub" x="350" y="382" text-anchor="middle">Ладонь — коробка: у неё есть тыл, ладонная сторона и торцы. Запястье у́же ладони, между ними ступенька.</text>
