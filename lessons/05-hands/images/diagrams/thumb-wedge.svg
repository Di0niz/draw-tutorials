  <text class="cap" x="56" y="64">вид с тыла</text>
  <text class="sub" x="238" y="106">кончик большого доходит</text>
  <text class="sub" x="238" y="124">до среднего сустава указательного</text>
  <text class="sub" x="340" y="348">основание клина —</text>
  <text class="sub" x="340" y="366">на уровне запястья</text>
  <text class="sub" x="280" y="436" text-anchor="middle">клин растёт от запястья, масса у основания пирамидальная</text>
  <text class="sub" x="280" y="454" text-anchor="middle">между большим и указательным натянута перепонка</text>
  <text class="cap" x="56" y="528">вид с торца</text>
  <text class="sub" x="212" y="556" text-anchor="end">прямая вдоль тыла ладони</text>
  <text class="sub" x="212" y="574" text-anchor="end">не задевает большой</text>
  <text class="sub" x="340" y="694">уровень запястья</text>
  <text class="sub" x="306" y="752">угол больше прямого</text>
  <text class="sub" x="280" y="800" text-anchor="middle">клин повёрнут под ладонь, он работает в своей плоскости</text>
</svg>
