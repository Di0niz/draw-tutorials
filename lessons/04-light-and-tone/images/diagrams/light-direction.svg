<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <defs>
    <pattern id="ld-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#9aa0a6" stroke-width="3"/>
    </pattern>
  </defs>

    <!-- ground plane -->
  <line x1="40" y1="300" x2="660" y2="300" stroke="#c9c2b4" stroke-width="1.4"/>

  <!-- light arrow, upper left, 45 degrees -->
  <g stroke="#b4530a" stroke-width="2.2" fill="none" stroke-linecap="round">
    <line x1="52" y1="48" x2="122" y2="118"/>
    <path d="M100 118 L122 118 L122 96"/>
  </g>
  <text x="52" y="38" font-family="Inter, sans-serif" font-size="13" fill="#6b7280">свет</text>

  <!-- ray hints -->
  <g stroke="#c9c2b4" stroke-width="1.2" stroke-dasharray="6 6">
    <line x1="150" y1="60" x2="230" y2="140"/>
    <line x1="330" y1="60" x2="410" y2="140"/>
    <line x1="480" y1="60" x2="560" y2="140"/>
  </g>

  <!-- ===== SPHERE ===== -->
  <circle cx="230" cy="232" r="68" fill="none" stroke="#1f2328" stroke-width="2.6"/>

  <!-- shadow side: one flat tone between terminator and contour -->
  <path d="M230 164 A22 68 0 0 1 230 300 A68 68 0 0 0 230 164 Z" fill="url(#ld-hatch)"/>

  <!-- sphere cast shadow, one flat tone, from contact point to the right -->
  <ellipse cx="292" cy="300" rx="72" ry="14" fill="none" stroke="#9aa0a6" stroke-width="1.4"/>
  <g stroke="#9aa0a6" stroke-width="2.4" stroke-linecap="round">
    <line x1="228" y1="296" x2="240" y2="304"/>
    <line x1="238" y1="291" x2="256" y2="307"/>
    <line x1="250" y1="289" x2="270" y2="309"/>
    <line x1="264" y1="288" x2="284" y2="310"/>
    <line x1="278" y1="288" x2="298" y2="310"/>
    <line x1="292" y1="288" x2="312" y2="310"/>
    <line x1="306" y1="289" x2="326" y2="309"/>
    <line x1="320" y1="291" x2="338" y2="307"/>
    <line x1="334" y1="294" x2="348" y2="304"/>
    <line x1="348" y1="297" x2="356" y2="301"/>
  </g>

  <!-- ===== BOX ===== -->
  <!-- front face (light), top face (light), right face (shadow) -->
  <g fill="none" stroke="#1f2328" stroke-width="2.6" stroke-linejoin="round">
    <path d="M440 200 L510 172 L596 196 L596 284 L510 312 L440 288 Z"/>
    <path d="M440 200 L510 228 L596 196"/>
    <line x1="510" y1="228" x2="510" y2="312"/>
  </g>

  <!-- shadow side of the box: right face, flat tone, hatching across the plane -->
  <g stroke="#9aa0a6" stroke-width="2.4" stroke-linecap="round">
    <line x1="516" y1="232" x2="516" y2="308"/>
    <line x1="524" y1="230" x2="524" y2="306"/>
    <line x1="532" y1="227" x2="532" y2="303"/>
    <line x1="540" y1="224" x2="540" y2="300"/>
    <line x1="548" y1="221" x2="548" y2="297"/>
    <line x1="556" y1="218" x2="556" y2="294"/>
    <line x1="564" y1="215" x2="564" y2="291"/>
    <line x1="572" y1="212" x2="572" y2="288"/>
    <line x1="580" y1="209" x2="580" y2="285"/>
    <line x1="588" y1="206" x2="588" y2="282"/>
  </g>

  <!-- box cast shadow -->
  <path d="M440 288 L510 312 L596 284 L660 306 L582 336 L470 300 Z" fill="none" stroke="#9aa0a6" stroke-width="1.4"/>
  <g stroke="#9aa0a6" stroke-width="2.4" stroke-linecap="round">
    <line x1="452" y1="294" x2="466" y2="304"/>
    <line x1="468" y1="296" x2="484" y2="308"/>
    <line x1="484" y1="299" x2="502" y2="312"/>
    <line x1="502" y1="303" x2="520" y2="316"/>
    <line x1="520" y1="307" x2="538" y2="320"/>
    <line x1="538" y1="310" x2="556" y2="323"/>
    <line x1="556" y1="312" x2="574" y2="326"/>
    <line x1="576" y1="310" x2="594" y2="324"/>
    <line x1="596" y1="304" x2="614" y2="318"/>
    <line x1="616" y1="300" x2="634" y2="312"/>
    <line x1="634" y1="299" x2="648" y2="307"/>
  </g>

  <!-- labels -->
  <text x="150" y="344" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">свет — одно пятно, тень — одно пятно</text>
  <text x="440" y="344" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">у каждого предмета своя падающая тень</text>
  <text x="40" y="372" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">Стадия: карта теней. Внутри тени градаций нет, контур на теневой стороне не обведён.</text>
</svg>
