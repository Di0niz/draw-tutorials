<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <rect width="700" height="400" fill="#ffffff"/>

  <!-- light: upper left, 45 degrees, the same source on every sheet of the lesson -->
  <g stroke="#b4530a" stroke-width="2.2" fill="none" stroke-linecap="round">
    <line x1="52" y1="48" x2="122" y2="118"/>
    <path d="M100 118 L122 118 L122 96"/>
  </g>
  <text x="52" y="38" font-family="Inter, sans-serif" font-size="13" fill="#6b7280">свет</text>

  <line x1="40" y1="293" x2="440" y2="293" stroke="#c9c2b4" stroke-width="1.4"/>

  <!-- reflected light lifts the shadow near the outer contour -->
  <path d="M123 267 A 88 88 0 0 0 247 143 A 88 76 -45 0 1 123 267 Z" fill="#e0dacd"/>
  <circle cx="185" cy="205" r="88" fill="none" stroke="#1f2328" stroke-width="2.6"/>
  <path d="M123 267 A 88 24 -45 0 0 247 143" fill="none" stroke="#b4530a" stroke-width="1.4" stroke-dasharray="7 5"/>

  <!-- core of the shadow: densest right behind the terminator, thinning outward -->
  <g fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linecap="round">
    <path d="M142 270 A 88 30 -45 0 0 172 255 M206 226 A 88 30 -45 0 0 235 192"/>
    <path d="M145 272 A 88 38 -45 0 0 177 259 M212 232 A 88 38 -45 0 0 239 197"/>
    <path d="M147 275 A 88 46 -45 0 0 182 264 M218 238 A 88 46 -45 0 0 244 202"/>
    <path d="M150 278 A 88 54 -45 0 0 187 269 M223 243 A 88 54 -45 0 0 249 207"/>
    <path d="M154 282 A 88 64 -45 0 0 193 275 M230 250 A 88 64 -45 0 0 255 213"/>
    <path d="M177 285 A 88 72 -45 0 0 236 256"/>
  </g>
  <path d="M182 290 A 88 82 -45 0 0 204 286 M243 263 A 88 82 -45 0 0 266 224" fill="none" stroke="#9aa0a6" stroke-width="0.8" stroke-linecap="round"/>

  <!-- cast shadow: sharp edge at the contact point, soft at the far end -->
  <path d="M262 281 A 84 15 0 0 0 262 311" fill="none" stroke="#9aa0a6" stroke-width="1.4"/>
  <path d="M262 281 A 84 15 0 0 1 262 311" fill="none" stroke="#9aa0a6" stroke-width="0.8" stroke-dasharray="4 4"/>
  <g stroke="#9aa0a6" stroke-width="1.4" stroke-linecap="round">
    <path d="M190 292 L196 300 M200 288 L210 304 M210 286 L222 306 M222 284 L234 307 M234 283 L248 308"/>
    <path d="M248 282 L262 309 M264 282 L278 308 M282 283 L294 307 M302 285 L312 305 M322 288 L330 302"/>
  </g>

  <!-- light bounced off the table into the shadow side -->
  <g stroke="#b4530a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="392" y1="278" x2="268" y2="244"/>
    <path d="M284 236 L268 244 L282 254"/>
  </g>
  <text x="352" y="304" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">отражённый свет</text>

  <line x1="250" y1="324" x2="264" y2="312" stroke="#c9c2b4" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="196" y="338" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">падающая тень</text>

  <!-- three-step scale with leaders to the sphere -->
  <g stroke="#c9c2b4" stroke-width="1" stroke-dasharray="5 4" fill="none">
    <path d="M470 110 L300 86 L168 166"/>
    <line x1="470" y1="195" x2="243" y2="197"/>
    <line x1="470" y1="265" x2="248" y2="262"/>
  </g>
  <rect x="470" y="96" width="75" height="58" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
  <rect x="470" y="166" width="75" height="58" fill="none" stroke="#1f2328" stroke-width="1.4"/>
  <rect x="470" y="236" width="75" height="58" fill="#e0dacd" stroke="#1f2328" stroke-width="1.4"/>
  <g stroke="#9aa0a6" stroke-width="1.4" stroke-linecap="round">
    <path d="M475 171 L475 219 M481 171 L481 219 M487 171 L487 219 M493 171 L493 219 M499 171 L499 219"/>
    <path d="M505 171 L505 219 M511 171 L511 219 M517 171 L517 219 M523 171 L523 219 M529 171 L529 219 M535 171 L535 219 M541 171 L541 219"/>
    <path d="M480 241 L480 289 M498 241 L498 289 M516 241 L516 289 M534 241 L534 289"/>
  </g>
  <text x="556" y="131" font-family="Inter, sans-serif" font-size="13" fill="#6b7280">свет</text>
  <text x="556" y="201" font-family="Inter, sans-serif" font-size="13" fill="#6b7280">ядро тени</text>
  <text x="556" y="271" font-family="Inter, sans-serif" font-size="13" fill="#6b7280">рефлекс</text>

  <text x="40" y="372" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">Самое тёмное — у границы света и тени. Теневой контур светлее ядра: туда приходит отражённый свет.</text>
</svg>
