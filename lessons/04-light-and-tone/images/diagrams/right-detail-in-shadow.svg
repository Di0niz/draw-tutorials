<svg width="320" height="430" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 430" font-family="Inter, sans-serif">
  <defs>
    <pattern id="rd-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#9aa0a6" stroke-width="3"/>
    </pattern>
    <pattern id="rd-light" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#c9c2b4" stroke-width="2"/>
    </pattern>
  </defs>

  <path d="M160 84 A30 96 0 0 1 160 276 A96 96 0 0 0 160 84 Z" fill="url(#rd-hatch)"/>
  <path d="M212 250 A78 78 0 0 0 232 206" fill="none" stroke="#e0dacd" stroke-width="7" stroke-linecap="round"/>
  <circle cx="160" cy="180" r="96" fill="none" stroke="#1f2328" stroke-width="2.6"/>

  <ellipse cx="116" cy="162" rx="17" ry="14" fill="url(#rd-light)" stroke="#9aa0a6" stroke-width="2"/>

  <path d="M216 176 L268 176" stroke="#b4530a" stroke-width="1.6" stroke-dasharray="5 5"/>
  <text x="274" y="180" font-size="12" fill="#b4530a">самое тёмное</text>

  <g font-size="12" fill="#6b7280">
    <text x="160" y="330" text-anchor="middle">деталь взята полутоном: она светлее</text>
    <text x="160" y="348" text-anchor="middle">собственной тени формы</text>
    <text x="160" y="380" text-anchor="middle">объём читается целиком, деталь</text>
    <text x="160" y="398" text-anchor="middle">подчиняется ему, а не спорит</text>
  </g>
</svg>
