<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
    <!-- light: upper left, 45 degrees, the same source on every sheet of the lesson -->
  <g stroke="#b4530a" stroke-width="2.2" fill="none" stroke-linecap="round">
    <line x1="52" y1="48" x2="122" y2="118"/>
    <path d="M100 118 L122 118 L122 96"/>
  </g>
  <text x="52" y="38" font-family="Inter, sans-serif" font-size="13" fill="#6b7280">свет</text>

  <!-- ===== SPHERE: the boundary is a soft band ===== -->
  <circle cx="195" cy="215" r="90" fill="none" stroke="#1f2328" stroke-width="2.6"/>

  <!-- half light on the lit side: sparse short arcs, tone arrives gradually -->
  <g fill="none" stroke="#9aa0a6" stroke-linecap="round">
    <path d="M138 240 A 90 30 -45 0 1 153 217 M197 173 A 90 30 -45 0 1 220 158" stroke-width="0.7"/>
    <path d="M147 248 A 90 14 -45 0 1 164 228 M185 205 A 90 14 -45 0 1 208 184 M228 167 A 90 14 -45 0 1 245 155" stroke-width="0.9"/>
  </g>

  <!-- terminator: nothing on the surface marks it, the line is read through the half light -->
  <path d="M131 279 A 90 25 -45 0 0 259 151" fill="none" stroke="#b4530a" stroke-width="1.4" stroke-dasharray="7 5"/>
  <circle cx="131" cy="279" r="3" fill="#b4530a"/>
  <circle cx="259" cy="151" r="3" fill="#b4530a"/>

  <!-- shadow side: arcs across the form, thinning out toward the outer contour -->
  <g fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linecap="round">
    <path d="M151 281 A 90 30 -45 0 0 182 265 M216 236 A 90 30 -45 0 0 245 202"/>
    <path d="M184 268 A 90 34 -45 0 0 219 239 M248 204 A 90 34 -45 0 0 262 172"/>
    <path d="M153 283 A 90 37 -45 0 0 186 269 M221 241 A 90 37 -45 0 0 249 206"/>
    <path d="M188 272 A 90 41 -45 0 0 224 244 M252 208 A 90 41 -45 0 0 265 174"/>
    <path d="M155 286 A 90 44 -45 0 0 190 274 M226 246 A 90 44 -45 0 0 254 210"/>
    <path d="M193 276 A 90 48 -45 0 0 229 249 M256 213 A 90 48 -45 0 0 267 177"/>
    <path d="M158 288 A 90 51 -45 0 0 194 278 M231 251 A 90 51 -45 0 0 258 214"/>
    <path d="M197 281 A 90 55 -45 0 0 234 254 M261 217 A 90 55 -45 0 0 270 179"/>
    <path d="M160 291 A 90 58 -45 0 0 199 282 M236 256 A 90 58 -45 0 0 262 219"/>
    <path d="M201 285 A 90 62 -45 0 0 239 259 M265 221 A 90 62 -45 0 0 272 182"/>
    <path d="M163 293 A 90 65 -45 0 0 203 287 M241 261 A 90 65 -45 0 0 267 223"/>
    <path d="M206 289 A 90 69 -45 0 0 244 264 M269 226 A 90 69 -45 0 0 275 205"/>
    <path d="M186 296 A 90 72 -45 0 0 207 291 M246 266 A 90 72 -45 0 0 271 227"/>
    <path d="M188 298 A 90 76 -45 0 0 249 269"/>
  </g>

  <!-- half light callout -->
  <line x1="98" y1="196" x2="165" y2="220" stroke="#c9c2b4" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="40" y="192" font-family="Inter, sans-serif" font-size="13" fill="#6b7280">полутон</text>

  <!-- ===== BOX: the boundary is an edge ===== -->
  <g fill="none" stroke="#1f2328" stroke-width="2.6" stroke-linejoin="round">
    <path d="M410 185 L500 150 L600 180 L600 285 L500 325 L410 290 Z"/>
    <path d="M410 185 L500 218 L600 180"/>
  </g>

  <!-- shadow face: straight strokes across the plane, starting right at the edge -->
  <g stroke="#9aa0a6" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M507 218 L507 319 M516 215 L516 315 M525 212 L525 312 M534 208 L534 308 M543 205 L543 304 M552 201 L552 301"/>
    <path d="M561 198 L561 297 M570 195 L570 293 M579 191 L579 290 M588 188 L588 286 M597 184 L597 283"/>
  </g>

  <!-- terminator on the box: it is the edge itself, one hard line -->
  <path d="M500 325 L500 218 L600 180" fill="none" stroke="#b4530a" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- tone jump callout -->
  <line x1="548" y1="136" x2="552" y2="192" stroke="#c9c2b4" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="516" y="128" font-family="Inter, sans-serif" font-size="13" fill="#6b7280">скачок тона</text>

  <!-- captions -->
  <text x="48" y="340" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">шар: мягкая граница, полутон, касание контура в двух точках</text>
  <text x="430" y="340" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">коробка: граница на ребре, тон скачком</text>
  <text x="40" y="372" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">Один и тот же свет. Круглая поверхность отворачивается постепенно, гранёная — сразу на ребре.</text>
</svg>
