<svg width="660" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" font-family="Inter, sans-serif">
  <style>
    .ttl { font-size: 15px; font-weight: 700; fill: #1f2328 }
    .lbl { font-size: 13px; fill: #1f2328 }
    .sub { font-size: 12px; fill: #6b7280 }
    .acc { font-size: 13px; fill: #b4530a }
    .lead { stroke: #c9c2b4; stroke-width: 1.3 }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4530a"/>
    </marker>
  </defs>

  <text class="ttl" x="20" y="28">Спереди</text>

  <g fill="none" stroke="#1f2328" stroke-width="2.6" stroke-linejoin="round">
    <path d="M104 62 C140 48 220 48 256 62"/>
    <path d="M84 100 C70 180 74 268 96 326 C132 350 228 350 264 326 C286 268 290 180 276 100 C246 72 114 72 84 100 Z"/>
    <path d="M124 326 L180 352 L236 326"/>
  </g>

  <g fill="none" stroke="#c9c2b4" stroke-width="1.6" stroke-dasharray="5 5">
    <line x1="180" y1="74" x2="180" y2="352"/>
    <ellipse cx="128" cy="228" rx="56" ry="52"/>
    <ellipse cx="232" cy="228" rx="56" ry="52"/>
  </g>

  <g fill="none" stroke="#1f2328" stroke-width="2.6">
    <ellipse cx="128" cy="230" rx="46" ry="41" transform="rotate(-14 128 230)"/>
    <ellipse cx="232" cy="230" rx="46" ry="41" transform="rotate(14 232 230)"/>
  </g>

  <g stroke="#b4530a" stroke-width="2.2" fill="none">
    <path d="M176 198 L116 244" marker-end="url(#a2)"/>
    <path d="M184 198 L244 244" marker-end="url(#a2)"/>
  </g>
  <g fill="#b4530a">
    <circle cx="110" cy="248" r="4.5"/>
    <circle cx="250" cy="248" r="4.5"/>
  </g>

  <line class="lead" x1="286" y1="140" x2="318" y2="128"/>
  <text class="lbl" x="324" y="124">грудная клетка</text>
  <text class="sub" x="324" y="141">всё лежит на ней</text>

  <text class="acc" x="20" y="404">Оси расходятся от грудины</text>
  <text class="sub" x="20" y="422">наружу и вниз, а не строго вперёд.</text>
  <text class="sub" x="20" y="440">Пунктир — след, которым масса села</text>
  <text class="sub" x="20" y="458">на клетку: он шире самой массы.</text>

  <line x1="360" y1="40" x2="360" y2="480" stroke="#e5e7eb" stroke-width="2"/>

  <text class="ttl" x="400" y="28">Сбоку</text>

  <g fill="none" stroke="#1f2328" stroke-width="2.6" stroke-linejoin="round">
    <path d="M466 78 C476 66 494 66 502 78"/>
    <path d="M502 78 C522 112 528 190 518 264 C512 308 504 332 496 352"/>
    <path d="M466 78 C444 112 436 190 444 264 C448 308 456 334 464 352"/>
  </g>

  <path d="M518 154 C558 172 584 210 576 246 C568 280 534 290 514 280"
        fill="none" stroke="#1f2328" stroke-width="2.6"/>
  <circle cx="578" cy="240" r="4.5" fill="#b4530a"/>

  <path d="M524 160 C552 176 568 196 574 216" fill="none" stroke="#b4530a" stroke-width="2.4"/>
  <text class="acc" x="500" y="128">верхний скат прямее</text>

  <path d="M572 258 C562 278 540 290 516 288" fill="none" stroke="#b4530a" stroke-width="2.4"/>
  <text class="acc" x="500" y="322">нижний — полная дуга</text>

  <text class="sub" x="400" y="404">Масса начинается примерно</text>
  <text class="sub" x="400" y="422">на втором ребре и заканчивается</text>
  <text class="sub" x="400" y="440">на шестом. Выше и ниже —</text>
  <text class="sub" x="400" y="458">плоскость грудной клетки.</text>
</svg>
