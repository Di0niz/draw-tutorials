<svg width="720" height="640" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" font-family="Inter, sans-serif">
  <style>
    .day { font-size: 16px; font-weight: 700; fill: #1f2328 }
    .topic { font-size: 15px; fill: #1f2328 }
    .meta { font-size: 12.5px; fill: #6b7280 }
    .cap { font-size: 12.5px; fill: #6b7280 }
    .hours { font-size: 13px; font-weight: 700; fill: #b4530a }
  </style>

  <line x1="34" y1="40" x2="34" y2="532" stroke="#b4530a" stroke-width="4" stroke-linecap="round"/>

  <g>
    <circle cx="34" cy="40" r="9" fill="#b4530a"/>
    <text class="day" x="62" y="34">День 1. Жест</text>
    <text class="topic" x="62" y="56">Линия действия через всю фигуру</text>
    <text class="meta" x="62" y="76">45 мин · один росчерк вместо контура</text>
    <text class="hours" x="700" y="34" text-anchor="end">0:45</text>
  </g>

  <g>
    <circle cx="34" cy="122" r="9" fill="#b4530a"/>
    <text class="day" x="62" y="116">День 2. Пропорции</text>
    <text class="topic" x="62" y="138">Фигура в 7,5 головах, ключевые отметки</text>
    <text class="meta" x="62" y="158">50 мин · середина фигуры не на талии</text>
    <text class="hours" x="700" y="116" text-anchor="end">1:35</text>
  </g>

  <g>
    <circle cx="34" cy="204" r="9" fill="#b4530a"/>
    <text class="day" x="62" y="198">День 3. Две массы</text>
    <text class="topic" x="62" y="220">Грудная клетка и таз, наклоны осей</text>
    <text class="meta" x="62" y="240">50 мин · тело как два объёма на шарнире</text>
    <text class="hours" x="700" y="198" text-anchor="end">2:25</text>
  </g>

  <g>
    <circle cx="34" cy="286" r="9" fill="#b4530a"/>
    <text class="day" x="62" y="280">День 4. Грудь</text>
    <text class="topic" x="62" y="302">Посадка и направление осей на клетке</text>
    <text class="meta" x="62" y="322">55 мин · не круги спереди, а массы на бочке</text>
    <text class="hours" x="700" y="280" text-anchor="end">3:20</text>
  </g>

  <g>
    <circle cx="34" cy="368" r="9" fill="#b4530a"/>
    <text class="day" x="62" y="362">День 5. Контур</text>
    <text class="topic" x="62" y="384">Ритм: прямая сторона против круглой</text>
    <text class="meta" x="62" y="404">50 мин · силуэт перестаёт быть вазой</text>
    <text class="hours" x="700" y="362" text-anchor="end">4:10</text>
  </g>

  <g>
    <circle cx="34" cy="450" r="9" fill="#b4530a"/>
    <text class="day" x="62" y="444">День 6. Вес</text>
    <text class="topic" x="62" y="466">Контрапост и линия отвеса</text>
    <text class="meta" x="62" y="486">50 мин · фигура перестаёт падать</text>
    <text class="hours" x="700" y="444" text-anchor="end">5:00</text>
  </g>

  <g>
    <circle cx="34" cy="532" r="9" fill="#1f2328"/>
    <text class="day" x="62" y="526">День 7. Сборка</text>
    <text class="topic" x="62" y="548">Весь силуэт за один заход, 20 минут</text>
    <text class="meta" x="62" y="568">60 мин · сравнение с рисунком первого дня</text>
    <text class="hours" x="700" y="526" text-anchor="end" fill="#1f2328">6:00</text>
  </g>

  <g transform="translate(0,606)">
    <text class="cap" x="0" y="0">Неделя закрывает 6 часов из 20</text>
    <text class="cap" x="720" y="0" text-anchor="end">дальше — повтор недели на новых позах</text>
    <rect x="0" y="12" width="720" height="10" rx="5" fill="#e5e7eb"/>
    <rect x="0" y="12" width="216" height="10" rx="5" fill="#b4530a"/>
  </g>
</svg>
