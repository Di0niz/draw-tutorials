<svg width="560" height="830" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 830" font-family="Inter, sans-serif">
  <defs>
    <path id="half" d="M180 20 C202 20 218 40 218 66 C218 92 206 114 194 124 C193 138 194 146 200 152 C222 156 246 164 256 180 C262 192 258 206 250 216 C244 238 240 268 232 290 C228 302 226 308 224 314 C236 330 250 348 254 372 C256 400 250 430 246 452 C242 490 236 540 230 574 C226 600 224 620 222 640 C220 670 214 700 208 724 C206 742 204 758 203 772 L213 792 L188 794 C188 768 189 748 189 728 C191 698 193 660 191 620 C189 560 186 480 184 420 L180 412"/>
  </defs>

  <style>
    .lvl { stroke: #c9c2b4; stroke-width: 1.4; stroke-dasharray: 4 5 }
    .num { font-size: 13px; font-weight: 700; fill: #b4530a }
    .lbl { font-size: 13px; fill: #1f2328 }
    .w { stroke: #b4530a; stroke-width: 2 }
    .wl { font-size: 12px; fill: #b4530a }
  </style>

  <g fill="none" stroke="#1f2328" stroke-width="2.4" stroke-linejoin="round">
    <use href="#half"/>
    <use href="#half" transform="translate(360,0) scale(-1,1)"/>
  </g>

  <g>
    <line class="lvl" x1="60" y1="20" x2="330" y2="20"/>
    <text class="num" x="30" y="24">0</text>
    <text class="lbl" x="336" y="24">макушка</text>

    <line class="lvl" x1="60" y1="123" x2="330" y2="123"/>
    <text class="num" x="30" y="127">1</text>
    <text class="lbl" x="336" y="127">подбородок — одна голова</text>

    <line class="lvl" x1="60" y1="175" x2="330" y2="175"/>
    <text class="num" x="24" y="179">1½</text>
    <text class="lbl" x="336" y="179">линия плеч</text>

    <line class="lvl" x1="60" y1="226" x2="330" y2="226"/>
    <text class="num" x="30" y="230">2</text>
    <text class="lbl" x="336" y="230">грудь, соски</text>

    <line class="lvl" x1="60" y1="304" x2="330" y2="304"/>
    <text class="num" x="18" y="308">2¾</text>
    <text class="lbl" x="336" y="308">талия — выше, чем кажется</text>

    <line class="lvl" x1="60" y1="407" x2="330" y2="407"/>
    <text class="num" x="18" y="411">3¾</text>
    <text class="lbl" x="336" y="411" font-weight="700">середина фигуры</text>
    <text class="lbl" x="336" y="428" fill="#6b7280">лобковая кость, не талия</text>

    <line class="lvl" x1="60" y1="588" x2="330" y2="588"/>
    <text class="num" x="18" y="592">5½</text>
    <text class="lbl" x="336" y="592">колено</text>

    <line class="lvl" x1="60" y1="794" x2="330" y2="794"/>
    <text class="num" x="18" y="798">7½</text>
    <text class="lbl" x="336" y="798">стопа</text>
  </g>

  <g>
    <line class="w" x1="104" y1="175" x2="256" y2="175"/>
    <line class="w" x1="104" y1="169" x2="104" y2="181"/>
    <line class="w" x1="256" y1="169" x2="256" y2="181"/>
    <text class="wl" x="180" y="202" text-anchor="middle">плечи ≈ 1½ головы</text>

    <line class="w" x1="136" y1="314" x2="224" y2="314"/>
    <line class="w" x1="136" y1="308" x2="136" y2="320"/>
    <line class="w" x1="224" y1="308" x2="224" y2="320"/>
    <text class="wl" x="180" y="336" text-anchor="middle">талия ≈ 1 голова</text>

    <line class="w" x1="106" y1="372" x2="254" y2="372"/>
    <line class="w" x1="106" y1="366" x2="106" y2="378"/>
    <line class="w" x1="254" y1="366" x2="254" y2="378"/>
    <text class="wl" x="180" y="394" text-anchor="middle">бёдра ≈ плечи или шире</text>
