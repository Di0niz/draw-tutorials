    <text class="lbl" x="292" y="142">шея</text>
    <text class="sub" x="292" y="160">цилиндр, наклонён вперёд</text>

    <text class="lbl" x="20" y="470" fill="#b4530a">оси плеч и таза</text>
    <text class="sub" x="20" y="488">идут в разные стороны,</text>
    <text class="sub" x="20" y="506">между ними — мягкая талия</text>
