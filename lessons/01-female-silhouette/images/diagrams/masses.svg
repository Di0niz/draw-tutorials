  <g stroke="#b4530a" stroke-width="2.6" fill="#b4530a">
    <line x1="108" y1="186" x2="252" y2="174"/>
    <circle cx="108" cy="186" r="4"/>
    <circle cx="252" cy="174" r="4"/>
    <line x1="118" y1="336" x2="242" y2="346"/>
