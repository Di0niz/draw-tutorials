<svg width="440" height="830" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 830" font-family="Inter, sans-serif">
  <style>
    .lbl { font-size: 14px; fill: #1f2328 }
    .acc { font-size: 13px; fill: #b4530a }
    .sub { font-size: 12px; fill: #6b7280 }
    .lead { stroke: #c9c2b4; stroke-width: 1.3 }
  </style>

  <line x1="180" y1="176" x2="180" y2="790" stroke="#c9c2b4" stroke-width="1.6" stroke-dasharray="6 6"/>
  <circle cx="180" cy="790" r="5" fill="#c9c2b4"/>

  <g fill="none" stroke="#1f2328" stroke-width="2.6" stroke-linejoin="round">
    <ellipse cx="184" cy="72" rx="38" ry="52"/>
    <path d="M172 124 L170 176 M198 124 L200 174"/>
    <ellipse cx="180" cy="240" rx="54" ry="62" transform="rotate(-7 180 240)"/>
    <path d="M150 288 L180 306 L210 288"/>
    <path d="M128 344 L236 362 L216 452 L198 432 L180 444 L164 428 L146 444 Z"/>
  </g>

  <g fill="none" stroke="#1f2328" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 444 L172 618 L178 780"/>
    <path d="M210 452 L236 606 L244 752"/>
  </g>
  <g fill="none" stroke="#1f2328" stroke-width="5" stroke-linecap="round">
    <path d="M178 784 L202 790"/>
    <path d="M244 756 L268 762"/>
  </g>

  <g stroke="#b4530a" stroke-width="2.8" fill="#b4530a">
    <line x1="118" y1="182" x2="244" y2="164"/>
    <circle cx="118" cy="182" r="4.5"/>
    <circle cx="244" cy="164" r="4.5"/>
    <line x1="124" y1="342" x2="246" y2="364"/>
    <circle cx="124" cy="342" r="4.5"/>
    <circle cx="246" cy="364" r="4.5"/>
  </g>

  <text class="acc" x="108" y="186" text-anchor="end">плечо вниз</text>
  <text class="acc" x="112" y="336" text-anchor="end">таз вверх</text>
  <text class="sub" x="112" y="354" text-anchor="end">со стороны опоры</text>

  <line class="lead" x1="176" y1="700" x2="118" y2="700"/>
  <text class="lbl" x="112" y="696" text-anchor="end">опорная</text>
  <text class="sub" x="112" y="714" text-anchor="end">нога прямая</text>

  <line class="lead" x1="240" y1="660" x2="300" y2="660"/>
  <text class="lbl" x="306" y="656">свободная</text>
  <text class="sub" x="306" y="674">колено согнуто</text>

  <text class="acc" x="264" y="480">отвес</text>
  <text class="sub" x="264" y="498">от ямки между ключицами</text>
  <text class="sub" x="264" y="516">падает на опорную стопу</text>
  <line class="lead" x1="260" y1="492" x2="182" y2="500"/>
</svg>
